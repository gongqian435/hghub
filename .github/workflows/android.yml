name: Android APK

# 只构建安卓，手动触发。
# 与 release.yml 的区别：不会同时跑 Windows / macOS 那三个 job，
# 想快速拿到一个能装的 APK 时用这个，省时间也省 Actions 额度。

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "构建类型：debug 用调试证书自动签名、可直接安装；release 需要先配好 4 个 secrets"
        type: choice
        options:
          - debug
          - release
        default: debug
      split_per_abi:
        description: "仅 release 生效：按 ABI 分包（体积更小，推荐）"
        type: boolean
        default: true

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  android:
    name: Android (${{ inputs.variant }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 准备 Android SDK / NDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "NDK_HOME=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android

      - run: pnpm install --frozen-lockfile

      - name: 生成 Android 工程
        run: pnpm tauri android init --ci

      - name: 编译（debug）
        if: inputs.variant == 'debug'
        run: pnpm tauri android build --apk --debug

      - name: 编译（release · 分包）
        if: inputs.variant == 'release' && inputs.split_per_abi == true
        run: pnpm tauri android build --apk --split-per-abi --target aarch64 armv7 x86_64

      - name: 编译（release · 通用包）
        if: inputs.variant == 'release' && inputs.split_per_abi == false
        run: pnpm tauri android build --apk

      - name: 签名 APK（release）
        if: inputs.variant == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::缺少 ANDROID_KEY_BASE64 secret，无法签名。请先在仓库 Settings → Secrets 里配置 4 个签名 secret，或用 debug 构建。"
            exit 1
          fi
          V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          KS="$RUNNER_TEMP/release.keystore"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
          BT="$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/$BT/apksigner"
          mkdir -p artifacts
          found=0
          for f in $(find src-tauri/gen/android/app/build/outputs/apk -name '*-release*.apk'); do
            abi="$(basename "$(dirname "$(dirname "$f")")")"
            out="artifacts/HGhub_${V}_${abi}.apk"
            "$APKSIGNER" sign \
              --ks "$KS" --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$STORE_PASSWORD" --key-pass "pass:$KEY_PASSWORD" \
              --v4-signing-enabled false \
              --out "$out" "$f"
            "$APKSIGNER" verify --print-certs "$out" | head -3
            found=$((found+1))
          done
          rm -f "$KS"
          if [ "$found" -eq 0 ]; then echo "::error::没有找到 release APK"; exit 1; fi
          ls -lh artifacts

      - name: 收集 debug 产物
        if: inputs.variant == 'debug'
        run: |
          set -euo pipefail
          V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          mkdir -p artifacts
          i=0
          for f in $(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk'); do
            i=$((i+1))
            cp "$f" "artifacts/HGhub_${V}_debug_${i}.apk"
          done
          if [ "$i" -eq 0 ]; then echo "::error::没有找到 debug APK"; exit 1; fi
          ls -lh artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ inputs.variant }}
          path: artifacts/*
          if-no-files-found: error
